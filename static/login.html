<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · MikroTik LAN Monitor</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#0e141c;--border:#1e2936;--fg:#e6edf3;
--muted:#8494a7;--accent:#4cc2ff;--red:#f85149;--radius:12px;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
#pnet{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.box{position:relative;z-index:1;background:var(--panel);border:1px solid var(--border);
border-radius:var(--radius);padding:26px 28px;width:min(360px,92vw);
box-shadow:0 12px 40px rgba(0,0,0,.45)}
h1{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin-bottom:18px}
input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--border);
color:var(--fg);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:12px}
button{width:100%;background:var(--accent);color:#04121e;border:0;border-radius:8px;
padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#err{color:#ffb4ab;font-size:12px;min-height:16px;margin:8px 0 0}
</style>
</head>
<body>
<canvas id="pnet" aria-hidden="true"></canvas>
<form class="box" id="f" autocomplete="off">
  <h1>🧭 MikroTik LAN Monitor</h1>
  <div class="sub">Enter the dashboard password to continue.</div>
  <input type="password" id="pw" placeholder="password" autofocus>
  <button type="submit" id="go">Log in</button>
  <div id="err"></div>
</form>
<script>
const $=s=>document.querySelector(s);
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const btn=$('#go');btn.disabled=true;$('#err').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({password:$('#pw').value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok){location.assign('/');return}
    $('#err').textContent=d.error||('HTTP '+r.status);
  }catch(err){$('#err').textContent='backend unreachable'}
  btn.disabled=false;
};
</script>
<script>
// Particle-network backdrop ("constellation"): slow drifting dots bounce at
// the edges; close pairs auto-link with distance-faded lines; the cursor
// gently attracts nearby dots and links to them. Canvas 2D + rAF, sized by
// devicePixelRatio. Colors are read from THIS page's theme variables — no
// new palette is introduced. Disabled to a single static frame under
// prefers-reduced-motion; paused while the tab is hidden.
{
 const cv=$('#pnet'),ctx=cv.getContext('2d');
 const cs=getComputedStyle(document.documentElement);
 const MUTED=(cs.getPropertyValue('--muted')||'#8494a7').trim();
 const ACC=(cs.getPropertyValue('--accent')||'#4cc2ff').trim();
 const RM=matchMedia('(prefers-reduced-motion: reduce)');
 let W=0,H=0,ps=[],mouse={x:-1e4,y:-1e4,on:false},last=0,run=true;
 function fit(){
  const dpr=window.devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.max(26,Math.min(70,Math.round(W*H/22000)));
  if(ps.length!==n)ps=Array.from({length:n},()=>({
   x:Math.random()*W,y:Math.random()*H,
   vx:(Math.random()*2-1)*16,vy:(Math.random()*2-1)*16,
   r:1+Math.random()*1.6}));
 }
 addEventListener('resize',fit);fit();
 const track=e=>{mouse={x:e.clientX,y:e.clientY,on:true}};
 addEventListener('pointermove',track);addEventListener('pointerdown',track);
 addEventListener('pointerleave',()=>mouse.on=false);
 addEventListener('blur',()=>mouse.on=false);
 function frame(ts){
  if(!run)return;
  if(!RM.matches)requestAnimationFrame(frame);
  const dt=Math.min((ts-last)/1000||.016,.05);last=ts;
  const D=Math.min(150,Math.max(90,Math.min(W,H)/7)),R=D*.95;
  for(const p of ps){
   if(mouse.on){const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
    if(d<R&&d>1){const a=30*(1-d/R);p.vx+=dx/d*a*dt;p.vy+=dy/d*a*dt;}}
   const v=Math.hypot(p.vx,p.vy);if(v>42){p.vx*=42/v;p.vy*=42/v;}
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   if(p.x<0||p.x>W)p.vx=Math.abs(p.vx)*(p.x<0?1:-1);       // bounce at walls
   if(p.y<0||p.y>H)p.vy=Math.abs(p.vy)*(p.y<0?1:-1);
   p.x=Math.max(0,Math.min(W,p.x));p.y=Math.max(0,Math.min(H,p.y));
  }
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=1;ctx.strokeStyle=MUTED;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
   const a=ps[i],b=ps[j],d=Math.hypot(a.x-b.x,a.y-b.y);
   if(d>D)continue;
   ctx.globalAlpha=(1-d/D)*.30;                      // nearer pair = clearer
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  if(mouse.on){ctx.strokeStyle=ACC;                  // constellation to cursor
   for(const p of ps){const d=Math.hypot(mouse.x-p.x,mouse.y-p.y);
    if(d>R)continue;
    ctx.globalAlpha=(1-d/R)*.5;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();}}
  ctx.globalAlpha=.55;ctx.fillStyle=MUTED;
  for(const p of ps){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  if(mouse.on){ctx.globalAlpha=.9;ctx.fillStyle=ACC;
   ctx.beginPath();ctx.arc(mouse.x,mouse.y,2.2,0,7);ctx.fill();}
  ctx.globalAlpha=1;
 }
 document.addEventListener('visibilitychange',()=>{
  run=!document.hidden;if(run)requestAnimationFrame(frame);});
 frame(performance.now());
}
</script>
</body>
</html>
