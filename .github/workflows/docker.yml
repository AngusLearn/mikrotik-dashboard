name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: anguslearn
          password: '${{ secrets.DOCKER_PUSH }}'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            anguslearn/mikrotik-dashboard:latest
            anguslearn/mikrotik-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub overview from README.md
        env:
          DOCKER_PUSH: '${{ secrets.DOCKER_PUSH }}'
        run: |
          set -euo pipefail
          JWT=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"username":"anguslearn","password":"$DOCKER_PUSH"}' \
            https://hub.docker.com/v2/users/login/ | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          JWT="$JWT" python3 - <<'PY'
          import json, os, urllib.request
          full = open("README.md").read()
          payload = json.dumps({
              "full_description": full,
              "description": "Live MikroTik LAN traffic dashboard: router profiles, per-profile history, WiFi stations view.",
          }).encode()
          req = urllib.request.Request(
              "https://hub.docker.com/v2/repositories/anguslearn/mikrotik-dashboard/",
              data=payload, method="PATCH",
              headers={"Authorization": "JWT " + os.environ["JWT"],
                       "Content-Type": "application/json"})
          print("hub description updated:", urllib.request.urlopen(req).status)
          PY
