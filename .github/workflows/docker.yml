name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    # NOTE: no `permissions:` block here on purpose. "releases" is not a key that
    # permissions: can grant — declaring any block would default the undeclared
    # releases scope to "none" and break the release step. The workflow token
    # must rely on the repo default: Settings → Actions → General →
    # Workflow permissions → "Read and write permissions".
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: anguslearn
          password: '${{ secrets.DOCKER_PUSH }}'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            anguslearn/mikrotik-dashboard:latest
            anguslearn/mikrotik-dashboard:${{ github.sha }}
            anguslearn/mikrotik-dashboard:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub overview page
        # Cosmetic only: needs a token with repo-edit ("Read, Write & Delete") scope.
        # Never block image publishing if it fails.
        continue-on-error: true
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: anguslearn
          DOCKER_PASS: '${{ secrets.DOCKER_PUSH }}'
        with:
          destination_container_repo: anguslearn/mikrotik-dashboard
          provider: dockerhub
          short_description: "Self-hosted live traffic dashboard for MikroTik RouterOS — per-device charts, network map"
          readme_file: DOCKER_HUB.md

      - name: Publish GitHub Release
        # Tag pushes only; uses the workflow's own token, no PAT permission needed.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md \
              || gh release edit "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
