name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: anguslearn
          password: '${{ secrets.DOCKER_PUSH }}'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            anguslearn/mikrotik-dashboard:latest
            anguslearn/mikrotik-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub overview page
        # Cosmetic only: needs a token with repo-edit ("Read, Write & Delete") scope.
        # Never block image publishing if it fails.
        continue-on-error: true
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: anguslearn
          DOCKER_PASS: '${{ secrets.DOCKER_PUSH }}'
        with:
          destination_container_repo: anguslearn/mikrotik-dashboard
          provider: dockerhub
          short_description: "Self-hosted live traffic dashboard for MikroTik RouterOS — per-device charts, network map"
          readme_file: DOCKER_HUB.md
